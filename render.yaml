services:
  # -----------------------------------------------------------
  # Backend NestJS Web Service (Free Tier)
  # -----------------------------------------------------------
  - type: web
    name: aapnosaath-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_SYNCHRONIZE
        value: true
      # Connect your free Neon or Supabase PostgreSQL database URL here:
      # - key: DATABASE_URL
      #   value: postgresql://...

  # -----------------------------------------------------------
  # Frontend Angular Static Site (Free Tier)
  # -----------------------------------------------------------
  - type: web
    name: aapnosaath-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist/frontend/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
